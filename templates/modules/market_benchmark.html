{% extends "shell.html" %}
{% block content %}
<div class="module-launcher">
    <div class="launcher-card">
        <div class="launcher-icon">
            <i class="fa-solid fa-chart-column"></i>
        </div>
        <h2>Market Benchmark</h2>
        <p>Compare property performance against market competitors.</p>
        <a href="{{ url }}" target="_blank" rel="noopener" class="btn-launch">
            <i class="fa-solid fa-arrow-up-right-from-square"></i> Launch Market Benchmark
        </a>
        <span class="launcher-hint">Opens in a new tab</span>
    </div>
</div>
{% endblock %}
