{% extends "shell.html" %}
{% block content %}
<style>
/* ── The Pitch Workflow ──────────────────────────────────────────────────────── */
.pitch-wrap       { display:flex; flex-direction:column; height:100%; padding:20px 24px; gap:16px; }
.pitch-header     { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px; }
.pitch-title-row  { display:flex; align-items:center; gap:10px; }
.pitch-title-row h2 { font-size:1.3rem; font-weight:700; color:var(--text-primary); margin:0; }
.pitch-title-row i  { color:#f59e0b; font-size:1.1rem; }

/* Tabs */
.pitch-tabs       { display:flex; gap:4px; border-bottom:2px solid var(--border-medium); }
.pitch-tab        { padding:7px 18px; border:none; background:none; cursor:pointer;
                    font-size:0.875rem; font-weight:600; color:var(--text-secondary);
                    border-bottom:2px solid transparent; margin-bottom:-2px; transition:.15s; }
.pitch-tab.active { color:var(--accent-gold); border-bottom-color:var(--accent-gold); }
.pitch-tab:hover:not(.active) { color:var(--text-primary); }
.pitch-tab-panel  { display:none; flex:1; flex-direction:column; gap:14px; overflow:hidden; }
.pitch-tab-panel.active { display:flex; }

/* Filters */
.pitch-filters    { display:flex; align-items:center; flex-wrap:wrap; gap:8px; }
.pitch-filters select { padding:6px 10px; border-radius:6px; border:1px solid var(--border-input);
                        background:var(--input-bg); color:var(--text-primary); font-size:0.875rem; min-width:150px; }
.pitch-filters select option { background:var(--surface-raised); color:var(--text-primary); }
.pitch-filters label { font-size:0.875rem; color:var(--text-secondary); display:flex; align-items:center; gap:6px; cursor:pointer; }

/* Stats */
.pitch-stats      { display:flex; gap:10px; flex-wrap:wrap; }
.pitch-stat       { background:var(--surface-raised); border:1px solid var(--border-light);
                    border-radius:8px; padding:9px 14px; min-width:110px; }
.pitch-stat-val   { font-size:1.2rem; font-weight:700; color:var(--accent-gold); }
.pitch-stat-lbl   { font-size:0.72rem; color:var(--text-secondary); margin-top:1px; }

/* Card grid */
.pitch-grid       { display:grid; grid-template-columns:repeat(auto-fill,minmax(310px,1fr));
                    gap:12px; overflow-y:auto; flex:1; align-content:start; padding-bottom:8px; }
.pitch-card       { background:var(--card-bg); border:1px solid var(--border-light);
                    border-radius:10px; padding:14px 16px; cursor:pointer;
                    transition:transform .12s, box-shadow .12s; display:flex; flex-direction:column; gap:8px; }
.pitch-card:hover { transform:translateY(-2px); box-shadow:0 6px 20px var(--shadow-overlay); }
.pitch-card-top   { display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
.pitch-card-title { font-weight:700; font-size:0.95rem; color:var(--text-primary); flex:1; line-height:1.35; }
.pitch-card-cat   { font-size:0.72rem; color:var(--text-secondary); font-style:italic; }
.pitch-card-desc  { font-size:0.82rem; color:var(--text-secondary); line-height:1.45;
                    display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical; overflow:hidden; }
.pitch-card-meta  { font-size:0.75rem; color:var(--text-secondary); display:flex; flex-wrap:wrap; gap:8px; margin-top:2px; }
.pitch-card-meta span { display:flex; align-items:center; gap:4px; }
.pitch-card-docs  { display:flex; gap:5px; }

/* Badges */
.badge            { display:inline-block; padding:2px 9px; border-radius:12px;
                    font-size:0.73rem; font-weight:600; white-space:nowrap; }
.badge-cyan   { background:rgba(103,232,224,.15); color:var(--accent-cyan); }
.badge-gold   { background:rgba(251,191,36,.15); color:#fbbf24; }
.badge-green  { background:rgba(34,197,94,.15); color:#22c55e; }
.badge-red    { background:rgba(239,68,68,.12); color:#ef4444; }
.badge-gray   { background:rgba(100,116,139,.15); color:#94a3b8; }
.badge-cat    { background:rgba(245,158,11,.1); color:#f59e0b; border:1px solid rgba(245,158,11,.2); }

.pitch-empty  { text-align:center; color:var(--text-secondary); padding:40px 0; grid-column:1/-1; }

/* Submit form */
.pitch-form       { display:flex; flex-direction:column; gap:14px; max-width:680px; }
.pf-group         { display:flex; flex-direction:column; gap:4px; }
.pf-label         { font-size:0.8rem; font-weight:600; color:var(--text-secondary);
                    text-transform:uppercase; letter-spacing:.4px; }
.pf-label .req    { color:#ef4444; margin-left:2px; }
.pf-input         { padding:8px 11px; border-radius:6px; border:1px solid var(--border-input);
                    background:var(--input-bg); color:var(--text-primary); font-size:0.875rem; }
.pf-input:focus   { outline:none; border-color:var(--accent-gold); }
.pf-input option  { background:var(--surface-raised); color:var(--text-primary); }
.pf-input::placeholder { color:var(--text-secondary); }
.pf-textarea      { min-height:130px; resize:vertical; font-family:inherit; line-height:1.5; }
.pf-row2          { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
.pf-file-group    { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
.pf-file-item     { display:flex; flex-direction:column; gap:4px; }
.pf-file-input    { padding:6px 8px; border-radius:6px; border:1px solid var(--border-input);
                    background:var(--input-bg); color:var(--text-primary); font-size:0.8rem; width:100%; }
.pf-err           { color:#ef4444; font-size:0.82rem; display:none; }
.btn-submit       { padding:9px 22px; background:rgba(245,158,11,.15); color:#f59e0b;
                    border:1px solid rgba(245,158,11,.35); border-radius:6px; font-size:0.9rem;
                    font-weight:600; cursor:pointer; transition:.15s; display:inline-flex; align-items:center; gap:6px; }
.btn-submit:hover { background:rgba(245,158,11,.28); }
.btn-submit:disabled { opacity:.5; cursor:not-allowed; }

/* Detail panel */
.pitch-panel      { position:fixed; top:0; right:0; height:100%; width:500px; max-width:95vw;
                    background:var(--content-header); border-left:1px solid var(--border-medium);
                    box-shadow:-4px 0 24px rgba(0,0,0,.35); z-index:800;
                    display:flex; flex-direction:column; transform:translateX(100%);
                    transition:transform .25s cubic-bezier(.4,0,.2,1); }
.pitch-panel.open { transform:translateX(0); }
.pp-header        { display:flex; align-items:center; justify-content:space-between;
                    padding:14px 18px; border-bottom:1px solid var(--border-medium); flex-shrink:0; }
.pp-header h3     { font-size:1rem; font-weight:700; color:var(--text-primary); margin:0; flex:1; padding-right:8px; }
.pp-close         { background:none; border:none; color:var(--text-secondary);
                    font-size:1.1rem; cursor:pointer; padding:4px; border-radius:4px; flex-shrink:0; }
.pp-close:hover   { color:var(--text-primary); background:var(--hover-bg); }
.pp-body          { flex:1; overflow-y:auto; padding:16px 18px; display:flex; flex-direction:column; gap:14px; }
.pp-footer        { padding:12px 18px; border-top:1px solid var(--border-medium);
                    display:flex; gap:8px; flex-shrink:0; flex-wrap:wrap; }
.pp-field         { display:flex; flex-direction:column; gap:3px; }
.pp-lbl           { font-size:0.74rem; font-weight:600; color:var(--text-secondary);
                    text-transform:uppercase; letter-spacing:.4px; }
.pp-val           { font-size:0.875rem; color:var(--text-primary); }
.pp-row2          { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.pp-desc          { font-size:0.85rem; color:var(--text-primary); line-height:1.55;
                    white-space:pre-wrap; background:var(--surface-raised);
                    border-radius:6px; padding:10px 12px; border:1px solid var(--border-subtle); }
.pp-doc-link      { color:var(--accent-cyan); font-size:0.85rem; text-decoration:none;
                    display:inline-flex; align-items:center; gap:5px; }
.pp-doc-link:hover { text-decoration:underline; }
.pp-review-area   { display:flex; flex-direction:column; gap:8px; }
.pp-review-select { padding:7px 10px; border-radius:6px; border:1px solid var(--border-input);
                    background:var(--input-bg); color:var(--text-primary); font-size:0.875rem; width:100%; }
.pp-review-select option { background:var(--surface-raised); color:var(--text-primary); }
.pp-review-textarea { padding:8px 10px; border-radius:6px; border:1px solid var(--border-input);
                      background:var(--input-bg); color:var(--text-primary); font-size:0.875rem;
                      width:100%; min-height:90px; resize:vertical; font-family:inherit; line-height:1.5; }
.pp-review-textarea:focus, .pp-review-select:focus { outline:none; border-color:var(--accent-gold); }
.pp-review-textarea::placeholder { color:var(--text-secondary); }
.btn-pp           { padding:7px 16px; border:none; border-radius:6px; font-size:0.875rem;
                    font-weight:600; cursor:pointer; transition:.15s; display:inline-flex; align-items:center; gap:6px; }
.btn-save-review  { background:rgba(245,158,11,.15); color:#f59e0b; border:1px solid rgba(245,158,11,.35); }
.btn-save-review:hover { background:rgba(245,158,11,.28); }
.btn-del-pitch    { background:rgba(239,68,68,.1); color:#ef4444; border:1px solid rgba(239,68,68,.25); }
.btn-del-pitch:hover { background:rgba(239,68,68,.2); }
</style>

<div class="pitch-wrap">

  <!-- Header -->
  <div class="pitch-header">
    <div class="pitch-title-row">
      <i class="fa-solid fa-lightbulb"></i>
      <h2>The Pitch Workflow</h2>
    </div>
  </div>

  <!-- Tabs -->
  <div class="pitch-tabs">
    <button class="pitch-tab active" data-tab="browse">
      <i class="fa-solid fa-list"></i> All Pitches
    </button>
    <button class="pitch-tab" data-tab="submit">
      <i class="fa-solid fa-plus"></i> Submit a Pitch
    </button>
    {% if not is_admin %}
    <button class="pitch-tab" data-tab="mine">
      <i class="fa-solid fa-user"></i> My Pitches
    </button>
    {% endif %}
  </div>

  <!-- Browse tab -->
  <div class="pitch-tab-panel active" id="tab-browse">
    <div class="pitch-filters">
      <select id="filterStatus">
        <option value="">All Statuses</option>
        {% for s in statuses %}
        <option value="{{ s }}">{{ s }}</option>
        {% endfor %}
      </select>
      <select id="filterCategory">
        <option value="">All Categories</option>
        {% for c in categories %}
        <option value="{{ c }}">{{ c }}</option>
        {% endfor %}
      </select>
      {% if is_admin %}
      <label><input type="checkbox" id="filterMine"> My Pitches Only</label>
      {% endif %}
    </div>

    <div class="pitch-stats" id="pitchStats"></div>

    <div class="pitch-grid" id="pitchGrid">
      <div class="pitch-empty"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>
    </div>
  </div>

  <!-- Submit tab -->
  <div class="pitch-tab-panel" id="tab-submit">
    <form class="pitch-form" id="pitchForm" enctype="multipart/form-data">
      <div class="pf-group">
        <label class="pf-label">Pitch Title <span class="req">*</span></label>
        <input class="pf-input" name="title" id="pTitle" maxlength="255" placeholder="A clear, compelling title for your idea" required>
      </div>
      <div class="pf-row2">
        <div class="pf-group">
          <label class="pf-label">Category <span class="req">*</span></label>
          <select class="pf-input" name="category" id="pCategory">
            {% for c in categories %}
            <option value="{{ c }}">{{ c }}</option>
            {% endfor %}
          </select>
        </div>
        <div class="pf-group">
          <label class="pf-label">Property / Location</label>
          <input class="pf-input" name="property" id="pProp" maxlength="255" placeholder="Property name or 'Company-Wide'">
        </div>
      </div>
      <div class="pf-group">
        <label class="pf-label">Description &amp; Business Case <span class="req">*</span></label>
        <textarea class="pf-input pf-textarea" name="comments" id="pComments" maxlength="2500"
                  placeholder="Describe your idea, the problem it solves, and the expected benefit..."></textarea>
      </div>
      <div class="pf-group">
        <label class="pf-label">Supporting Documents <span style="color:var(--text-secondary);font-weight:400;font-size:0.78rem">(up to 3 files)</span></label>
        <div class="pf-file-group">
          <div class="pf-file-item">
            <label class="pf-label" style="text-transform:none">Document 1</label>
            <input class="pf-file-input" type="file" name="doc_1">
          </div>
          <div class="pf-file-item">
            <label class="pf-label" style="text-transform:none">Document 2</label>
            <input class="pf-file-input" type="file" name="doc_2">
          </div>
          <div class="pf-file-item">
            <label class="pf-label" style="text-transform:none">Document 3</label>
            <input class="pf-file-input" type="file" name="doc_3">
          </div>
        </div>
      </div>
      <div class="pf-err" id="pErr"></div>
      <div>
        <button type="submit" class="btn-submit" id="pSubmitBtn">
          <i class="fa-solid fa-paper-plane"></i> Submit Pitch
        </button>
      </div>
      <div id="pSuccess" style="display:none;color:#22c55e;font-size:0.9rem;font-weight:600;"></div>
    </form>
  </div>

  <!-- My Pitches tab (non-admin) -->
  {% if not is_admin %}
  <div class="pitch-tab-panel" id="tab-mine">
    <div class="pitch-grid" id="pitchGridMine">
      <div class="pitch-empty"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>
    </div>
  </div>
  {% endif %}

</div>

<!-- Detail panel -->
<div class="pitch-panel" id="pitchPanel">
  <div class="pp-header">
    <h3 id="ppTitle">Pitch Detail</h3>
    <button class="pp-close" id="ppClose">&#x2715;</button>
  </div>
  <div class="pp-body" id="ppBody"></div>
  <div class="pp-footer" id="ppFooter"></div>
</div>

{% endblock %}

{% block scripts %}
<script>
(function() {
    const IS_ADMIN = {{ 'true' if is_admin else 'false' }};
    const STATUSES = {{ statuses | tojson }};
    const STATUS_BADGE = {
        'Submitted':    'badge-cyan',
        'Under Review': 'badge-gold',
        'Approved':     'badge-green',
        'Rejected':     'badge-red',
        'On Hold':      'badge-gray',
    };

    // ── Tabs ────────────────────────────────────────────────────────────────
    let _mineLoaded = false;
    document.querySelectorAll('.pitch-tab').forEach(tab => {
        tab.addEventListener('click', () => {
            document.querySelectorAll('.pitch-tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.pitch-tab-panel').forEach(p => p.classList.remove('active'));
            tab.classList.add('active');
            const panel = document.getElementById('tab-' + tab.dataset.tab);
            if (panel) panel.classList.add('active');
            if (tab.dataset.tab === 'mine' && !_mineLoaded) { loadMine(); _mineLoaded = true; }
        });
    });

    // ── Load browse grid ────────────────────────────────────────────────────
    async function loadBrowse() {
        const grid = document.getElementById('pitchGrid');
        grid.innerHTML = '<div class="pitch-empty"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>';
        const p = new URLSearchParams();
        const st = document.getElementById('filterStatus').value;
        const ct = document.getElementById('filterCategory').value;
        const mine = document.getElementById('filterMine');
        if (st) p.set('status', st);
        if (ct) p.set('category', ct);
        if (mine && mine.checked) p.set('mine', '1');
        try {
            const data = await fetch('/pitch/api/pitches?' + p.toString()).then(r => r.json());
            renderStats(data);
            renderGrid(grid, data);
        } catch(e) {
            grid.innerHTML = '<div class="pitch-empty">Error loading pitches.</div>';
        }
    }

    async function loadMine() {
        const grid = document.getElementById('pitchGridMine');
        if (!grid) return;
        grid.innerHTML = '<div class="pitch-empty"><i class="fa-solid fa-spinner fa-spin"></i> Loading...</div>';
        try {
            const data = await fetch('/pitch/api/pitches?mine=1').then(r => r.json());
            renderGrid(grid, data);
        } catch(e) {
            grid.innerHTML = '<div class="pitch-empty">Error loading pitches.</div>';
        }
    }

    function renderStats(data) {
        const stats = document.getElementById('pitchStats');
        if (!stats || !IS_ADMIN) return;
        const counts = {};
        STATUSES.forEach(s => counts[s] = 0);
        data.forEach(r => { if (r.PITCH_STATUS in counts) counts[r.PITCH_STATUS]++; });
        stats.innerHTML = `<div class="pitch-stat"><div class="pitch-stat-val">${data.length}</div><div class="pitch-stat-lbl">Total</div></div>` +
            STATUSES.map(s => `<div class="pitch-stat"><div class="pitch-stat-val">${counts[s]}</div><div class="pitch-stat-lbl">${s}</div></div>`).join('');
    }

    function renderGrid(grid, data) {
        if (!data.length) {
            grid.innerHTML = '<div class="pitch-empty">No pitches found.</div>';
            return;
        }
        grid.innerHTML = data.map(r => {
            const badge = STATUS_BADGE[r.PITCH_STATUS] || 'badge-gray';
            const docBadges = [r.DOCUMENT_NAME_1, r.DOCUMENT_NAME_2, r.DOCUMENT_NAME_3]
                .filter(Boolean).map(n => `<span class="badge badge-gray" title="${escHtml(n)}"><i class="fa-solid fa-paperclip"></i></span>`).join(' ');
            return `<div class="pitch-card" data-id="${r.ID}">
                <div class="pitch-card-top">
                    <div class="pitch-card-title">${escHtml(r.PITCH_TITLE || '(Untitled)')}</div>
                    <span class="badge ${badge}">${escHtml(r.PITCH_STATUS || '—')}</span>
                </div>
                ${r.PITCH_CATEGORY ? `<div class="pitch-card-cat"><span class="badge badge-cat">${escHtml(r.PITCH_CATEGORY)}</span></div>` : ''}
                <div class="pitch-card-desc">${escHtml(r.COMMENTS || '')}</div>
                <div class="pitch-card-meta">
                    <span><i class="fa-solid fa-user"></i> ${escHtml(r.EMPLOYEE_NAME_FULL || r.MODIFIED_BY || '—')}</span>
                    ${r.PROPERTY_OR_LOCATION ? `<span><i class="fa-solid fa-building"></i> ${escHtml(r.PROPERTY_OR_LOCATION)}</span>` : ''}
                    ${r.DATE_CREATED ? `<span><i class="fa-regular fa-calendar"></i> ${String(r.DATE_CREATED).replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3')}</span>` : ''}
                </div>
                ${docBadges ? `<div class="pitch-card-docs">${docBadges}</div>` : ''}
            </div>`;
        }).join('');
        grid.querySelectorAll('.pitch-card').forEach(c => {
            c.addEventListener('click', () => openPanel(parseInt(c.dataset.id)));
        });
    }

    // ── Filters ─────────────────────────────────────────────────────────────
    document.getElementById('filterStatus').addEventListener('change', loadBrowse);
    document.getElementById('filterCategory').addEventListener('change', loadBrowse);
    const filterMine = document.getElementById('filterMine');
    if (filterMine) filterMine.addEventListener('change', loadBrowse);

    // ── Panel ────────────────────────────────────────────────────────────────
    const panel = document.getElementById('pitchPanel');
    document.getElementById('ppClose').addEventListener('click', () => panel.classList.remove('open'));

    async function openPanel(id) {
        panel.classList.add('open');
        document.getElementById('ppTitle').textContent = 'Loading...';
        document.getElementById('ppBody').innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i>';
        document.getElementById('ppFooter').innerHTML = '';
        try {
            const r = await fetch(`/pitch/api/pitch/${id}`).then(r => r.json());
            renderPanelView(r);
        } catch(e) {
            document.getElementById('ppBody').innerHTML = 'Error loading pitch.';
        }
    }

    function renderPanelView(r) {
        document.getElementById('ppTitle').textContent = r.PITCH_TITLE || '(Untitled)';
        const badge = STATUS_BADGE[r.PITCH_STATUS] || 'badge-gray';
        const dateStr = r.DATE_CREATED ? String(r.DATE_CREATED).replace(/(\d{4})(\d{2})(\d{2})/, '$1-$2-$3') : '—';
        const docs = [1,2,3].filter(i => r[`has_doc_${i}`]).map(i =>
            `<a class="pp-doc-link" href="/pitch/api/pitch/${r.ID}/doc/${i}"><i class="fa-solid fa-file-arrow-down"></i> ${escHtml(r[`DOCUMENT_NAME_${i}`] || `Document ${i}`)}</a>`
        ).join('');

        document.getElementById('ppBody').innerHTML = `
            <div class="pp-row2">
                <div class="pp-field"><div class="pp-lbl">Status</div><div class="pp-val"><span class="badge ${badge}">${escHtml(r.PITCH_STATUS || '—')}</span></div></div>
                <div class="pp-field"><div class="pp-lbl">Category</div><div class="pp-val">${r.PITCH_CATEGORY ? `<span class="badge badge-cat">${escHtml(r.PITCH_CATEGORY)}</span>` : '—'}</div></div>
            </div>
            <div class="pp-row2">
                <div class="pp-field"><div class="pp-lbl">Submitted By</div><div class="pp-val">${escHtml(r.EMPLOYEE_NAME_FULL || r.MODIFIED_BY || '—')}</div></div>
                <div class="pp-field"><div class="pp-lbl">Date Submitted</div><div class="pp-val">${dateStr}</div></div>
            </div>
            ${r.PROPERTY_OR_LOCATION ? `<div class="pp-field"><div class="pp-lbl">Property / Location</div><div class="pp-val">${escHtml(r.PROPERTY_OR_LOCATION)}</div></div>` : ''}
            <div class="pp-field"><div class="pp-lbl">Description &amp; Business Case</div><div class="pp-desc">${escHtml(r.COMMENTS || '—')}</div></div>
            ${docs ? `<div class="pp-field"><div class="pp-lbl">Attachments</div><div class="pp-val" style="display:flex;flex-direction:column;gap:5px">${docs}</div></div>` : ''}
            ${r.REVIEW_COMMENTS ? `<div class="pp-field"><div class="pp-lbl">Review Comments</div><div class="pp-desc" style="border-color:rgba(245,158,11,.25)">${escHtml(r.REVIEW_COMMENTS)}</div></div>` : ''}
            ${r.REVIEWED_BY ? `<div class="pp-field"><div class="pp-lbl">Reviewed By</div><div class="pp-val" style="font-size:.8rem;color:var(--text-secondary)">${escHtml(r.REVIEWED_BY)}</div></div>` : ''}
            ${IS_ADMIN ? `
            <div class="pp-review-area">
                <div class="pp-lbl" style="margin-bottom:2px">Update Review</div>
                <select class="pp-review-select" id="ppStatusSel">
                    ${STATUSES.map(s => `<option value="${s}"${r.PITCH_STATUS===s?' selected':''}>${s}</option>`).join('')}
                </select>
                <textarea class="pp-review-textarea" id="ppReviewTxt" placeholder="Add review comments...">${escHtml(r.REVIEW_COMMENTS || '')}</textarea>
            </div>` : ''}
        `;

        const footer = document.getElementById('ppFooter');
        if (IS_ADMIN) {
            footer.innerHTML = `
                <button class="btn-pp btn-save-review" id="ppSaveBtn"><i class="fa-solid fa-floppy-disk"></i> Save Review</button>
                <button class="btn-pp btn-del-pitch" id="ppDelBtn"><i class="fa-solid fa-trash"></i> Delete</button>
            `;
            footer.querySelector('#ppSaveBtn').addEventListener('click', () => saveReview(r.ID));
            footer.querySelector('#ppDelBtn').addEventListener('click', () => deletePitch(r.ID, r.PITCH_TITLE));
        }
    }

    async function saveReview(id) {
        const status  = document.getElementById('ppStatusSel').value;
        const review  = document.getElementById('ppReviewTxt').value.trim();
        const btn     = document.getElementById('ppSaveBtn');
        btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';
        try {
            const res = await fetch(`/pitch/api/pitch/${id}`, {
                method: 'PATCH',
                headers: {'Content-Type':'application/json'},
                body: JSON.stringify({ PITCH_STATUS: status, REVIEW_COMMENTS: review })
            });
            if (!res.ok) throw new Error('Save failed');
            await loadBrowse();
            openPanel(id);
        } catch(e) {
            btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-floppy-disk"></i> Save Review';
            alert('Save failed: ' + e.message);
        }
    }

    async function deletePitch(id, title) {
        if (!confirm(`Delete "${title}"?\nThis cannot be undone.`)) return;
        try {
            const res = await fetch(`/pitch/api/pitch/${id}`, {method:'DELETE'});
            if (!res.ok) throw new Error('Delete failed');
            panel.classList.remove('open');
            await loadBrowse();
        } catch(e) { alert('Delete failed: ' + e.message); }
    }

    // ── Submit form ─────────────────────────────────────────────────────────
    document.getElementById('pitchForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn    = document.getElementById('pSubmitBtn');
        const errEl  = document.getElementById('pErr');
        const succEl = document.getElementById('pSuccess');
        errEl.style.display = 'none';
        succEl.style.display = 'none';
        btn.disabled = true; btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Submitting...';
        try {
            const fd  = new FormData(e.target);
            const res = await fetch('/pitch/api/pitch', {method:'POST', body:fd});
            const data = await res.json();
            if (!res.ok || data.error) throw new Error(data.error || 'Submit failed');
            e.target.reset();
            succEl.textContent = `Pitch submitted successfully (ID #${data.ID}). Thank you!`;
            succEl.style.display = '';
            await loadBrowse();
        } catch(err) {
            errEl.textContent = err.message; errEl.style.display = '';
        }
        btn.disabled = false; btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Submit Pitch';
    });

    // ── Utility ─────────────────────────────────────────────────────────────
    function escHtml(s) {
        return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    loadBrowse();
})();
</script>
{% endblock %}
